- name: 'configure all nodes'
  hosts: all
  become: true
  tasks:
    - name: 'install longhorn dependencies'
      ansible.builtin.apt:
        name:
          - 'open-iscsi'
          - 'cryptsetup'

    - name: 'enable /proc/config.gz'
      community.general.modprobe:
        name: 'configs'
        persistent: present

    - name: 'enable encryption kmod'
      community.general.modprobe:
        name: 'dm_crypt'
        persistent: present

- name: 'configure storage nodes'
  hosts: storage
  become: true
  tasks:
    - name: 'label storage nodes to be used with longhorn'
      become: false
      delegate_to: localhost
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          kind: Node
          metadata:
            name: "{{ inventory_hostname_short }}"
            labels:
              node.longhorn.io/create-default-disk: 'true'

- name: 'install longhorn'
  hosts: localhost
  tasks:
    - name: 'add longhorn helm repo'
      kubernetes.core.helm_repository:
        name: 'longhorn'
        repo_url: 'https://charts.longhorn.io'

    - name: 'install longhorn'
      kubernetes.core.helm:
        name: 'longhorn'
        chart_ref: 'longhorn/longhorn'
        release_namespace: 'longhorn-system'
        create_namespace: true
        values_files:
          - 'values.yaml'

    # https://kubernetes.io/docs/concepts/storage/storage-classes/#default-storageclass
    - name: 'unset local-path storage class as default'
      kubernetes.core.k8s:
        state: patched
        definition:
          apiVersion: v1
          kind: StorageClass
          metadata:
            name: 'local-path'
            annotations:
              storageclass.kubernetes.io/is-default-class: 'false'
