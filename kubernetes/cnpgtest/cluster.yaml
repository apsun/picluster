apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpgtest
spec:
  instances: 2
  storage:
    size: 1Gi
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cnpgtest
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: cnpgtest
  podMetricsEndpoints:
  - port: metrics
